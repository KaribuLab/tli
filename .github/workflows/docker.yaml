# Publica la imagen de tli en Docker Hub.
#
# Se invoca desde el workflow "Build and Release" una vez que existe el tag del
# release (creado por `kli semver -t -v` o pusheado a mano), de modo que toda
# imagen publicada corresponde siempre a un release y nunca a un commit
# intermedio de main. No se dispara por evento `push: tags` porque los tags
# creados con GITHUB_TOKEN no generan disparos de workflow.
#
# Tags generados por release, por ejemplo para el tag v1.2.3:
#   karibu/tli:1.2.3
#   karibu/tli:latest
name: Publish Docker Image

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag de git a publicar, con la v inicial (ej. v1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de git a publicar, con la v inicial (ej. v1.2.3)'
        required: true
        type: string

env:
  IMAGE_NAME: karibu/tli

jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `{{version}}` quita la "v" inicial (v1.2.3 -> 1.2.3) y el flavor agrega
      # `latest` solo cuando el tag es un release estable, no un pre-release.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}

      # VERSION se inyecta con -ldflags en el binario para que `tli --version`
      # muestre el tag del release.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
